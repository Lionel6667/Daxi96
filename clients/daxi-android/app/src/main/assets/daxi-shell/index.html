<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070B14">
  <title>Daxi</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#070B14;color:#f8fafc;min-height:100vh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);}
    .hero{text-align:center;padding:28px 12px 20px;}
    .logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#f59e0b,#d97706);display:inline-flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 12px 40px rgba(245,158,11,.35);}
    h1{font-size:28px;font-weight:900;margin-top:14px;letter-spacing:-.5px;}
    .tag{display:inline-block;margin-top:8px;padding:6px 12px;border-radius:99px;font-size:11px;font-weight:800;background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.3);}
    .tag.off{background:rgba(239,68,68,.12);color:#fca5a5;border-color:rgba(239,68,68,.3);}
    .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px;margin:12px 0;}
    .card h2{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#64748b;margin-bottom:10px;}
    .order{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px;}
    .order:last-child{border:none;}
    .muted{color:#94a3b8;font-size:13px;line-height:1.5;}
    .btn{display:block;width:100%;margin-top:16px;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;font-weight:900;font-size:14px;cursor:pointer;}
    #map{height:160px;border-radius:14px;background:linear-gradient(160deg,#0f172a,#1e293b);display:flex;align-items:center;justify-content:center;color:#64748b;font-size:12px;margin-top:8px;}
  </style>
</head>
<body>
  <div class="hero">
    <div class="logo"><img src="assets/images/daxi-logo-gold.png" alt="Daxi" style="width:180px;height:auto;"></div>
    <h1>Daxi</h1>
    <div class="tag" id="status-pill">Mode hors ligne</div>
  </div>
  <div class="card">
    <h2>Vos courses (cache)</h2>
    <div id="orders-list" class="muted">Chargement du cache local…</div>
  </div>
  <div class="card">
    <h2>Carte Haïti</h2>
    <div id="map">Carte disponible avec connexion</div>
  </div>
  <p class="muted" style="padding:0 4px;">Consultation hors ligne. Commander ou chatter nécessite Internet.</p>
  <button type="button" class="btn" id="btn-sync" onclick="tryGoLive()">Synchroniser</button>
  <script>
    function readBootstrap() {
      if (window.DaxiAndroid && DaxiAndroid.getOfflineBootstrap) {
        try { return JSON.parse(DaxiAndroid.getOfflineBootstrap() || '{}'); } catch(e) {}
      }
      return null;
    }
    function render(data) {
      if (!data || !data.ok) return;
      var list = document.getElementById('orders-list');
      if (!data.orders || !data.orders.length) {
        list.textContent = 'Aucune course en cache pour le moment.';
        return;
      }
      list.innerHTML = data.orders.slice(0, 8).map(function(o) {
        return '<div class="order"><strong>' + (o.pickup_display || o.pickup || 'Course') + '</strong><br><span class="muted">' + (o.status_display || o.status || '') + '</span></div>';
      }).join('');
    }
    function updateOnline() {
      var online = (window.DaxiAndroid && DaxiAndroid.isOnline) ? DaxiAndroid.isOnline() : navigator.onLine;
      var pill = document.getElementById('status-pill');
      pill.textContent = online ? 'En ligne — sync possible' : 'Hors ligne — cache local';
      pill.className = 'tag' + (online ? '' : ' off');
      return online;
    }
    window.tryGoLive = function() {
      if (window.DaxiAndroid && DaxiAndroid.triggerOfflineSync) DaxiAndroid.triggerOfflineSync();
      if (!updateOnline()) alert('Pas de connexion. Le cache local reste actif.');
    };
    document.addEventListener('DOMContentLoaded', function() {
      updateOnline();
      render(readBootstrap());
    });
  </script>
</body>
</html>
