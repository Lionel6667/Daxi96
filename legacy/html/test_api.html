<!DOCTYPE html>
<html>
<head>
    <title>Test API Chat</title>
</head>
<body>
    <h1>Test API DAXI</h1>
    <button onclick="testAPI()">Tester l'API</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Envoi...';

            try {
                const response = await fetch('https://daxipro.42web.io/phpscript/api.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Bonjour',
                        history: [],
                        userId: null,
                        language: 'fr'
                    })
                });

                const text = await response.text();
                console.log('Raw response:', text);
                
                const data = JSON.parse(text);
                console.log('Parsed response:', data);

                if (data.success) {
                    resultDiv.innerHTML = '<h3>Succès!</h3><p>' + data.response + '</p>';
                } else {
                    resultDiv.innerHTML = '<h3 style="color:red;">Erreur</h3><p>' + (data.error || 'Unknown error') + '</p>';
                }
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = '<h3 style="color:red;">Exception</h3><p>' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
