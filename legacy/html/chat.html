<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat DAXI</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .close-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9fafb;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .message.assistant .message-avatar {
            background: #e5e7eb;
            color: #667eea;
        }

        .message-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 15px;
            word-wrap: break-word;
            min-width: 100px;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-bubble {
            background: white;
            color: #1f2937;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .message.system .message-bubble {
            background: #f3f4f6;
            color: #6b7280;
            font-style: italic;
            text-align: center;
            border-radius: 15px;
            box-shadow: none;
        }

        .message-time {
            font-size: 0.7rem;
            color: #9ca3af;
            margin-top: 5px;
            text-align: right;
        }

        .message.assistant .message-time {
            text-align: left;
        }

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background: white;
            border-radius: 15px;
            width: fit-content;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.7;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        .chat-input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #e5e7eb;
            border-radius: 25px;
            outline: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-btn {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
        }

        .welcome-message i {
            font-size: 60px;
            color: #667eea;
            margin-bottom: 15px;
        }

        .welcome-message h3 {
            color: #1f2937;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>
                <i class="ri-customer-service-2-line"></i>
                Assistance DAXI
            </h2>
            <button class="close-btn" onclick="window.history.back()">
                <i class="ri-close-line" style="font-size: 20px;"></i>
            </button>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <i class="ri-message-3-line"></i>
                <h3>Bienvenue chez DAXI</h3>
                <p>Notre équipe est là pour vous aider.<br>Posez votre question !</p>
            </div>

            <div class="typing-indicator" id="typingIndicator">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>

        <div class="chat-input-area">
            <input 
                type="text" 
                class="chat-input" 
                id="chatInput" 
                placeholder="Écrivez votre message..."
                autocomplete="off"
            >
            <button class="send-btn" id="sendBtn">
                <i class="ri-send-plane-fill"></i>
            </button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');

        let conversationHistory = [];
        let userId = localStorage.getItem('userId') || null;
        let language = localStorage.getItem('selectedLanguage') || 'fr';
        let notificationPollInterval = null;

        // Generate userId if not exists
        if (!userId) {
            userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('userId', userId);
        }

        // Load conversation history from localStorage
        loadConversationFromStorage();

        // Request notification permission
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // Start notification polling on page load
        startNotificationPolling();

        // Send message
        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            // Display user message
            addMessage('user', message);
            chatInput.value = '';
            sendBtn.disabled = true;

            // Show typing indicator
            typingIndicator.classList.add('active');
            scrollToBottom();

            try {
                // Call queue API
                const response = await fetch('/phpscript/api_queue.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        history: conversationHistory,
                        userId: userId,
                        language: language
                    })
                });

                const data = await response.json();

                if (data.success) {
                    if (data.immediate) {
                        // Simulate typing delay (3 seconds)
                        await new Promise(resolve => setTimeout(resolve, 3000));
                        
                        // Hide typing indicator after delay
                        typingIndicator.classList.remove('active');
                        
                        // Display response
                        addMessage('assistant', data.response);

                        // Update history
                        conversationHistory.push(
                            { role: 'user', content: message },
                            { role: 'assistant', content: data.response }
                        );
                        
                        // Save to localStorage
                        saveConversationToStorage();
                    } else if (data.queued) {
                        // Message queued - hide typing indicator, wait for notification
                        typingIndicator.classList.remove('active');
                        
                        // Update history with user message only
                        conversationHistory.push({ role: 'user', content: message });
                        saveConversationToStorage();
                    }

                    // Keep only last 10 messages
                    if (conversationHistory.length > 20) {
                        conversationHistory = conversationHistory.slice(-20);
                    }
                } else {
                    console.error('API Error:', data);
                    addMessage('assistant', data.error || "Désolé, une erreur s'est produite. Veuillez réessayer.");
                }
            } catch (error) {
                console.error('Network Error:', error);
                typingIndicator.classList.remove('active');
                addMessage('assistant', "Impossible de se connecter au serveur. Vérifiez votre connexion.");
            }

            sendBtn.disabled = false;
            chatInput.focus();
        }

        // Start polling for notifications
        function startNotificationPolling() {
            // Clear existing interval if any
            if (notificationPollInterval) {
                clearInterval(notificationPollInterval);
            }

            // Poll every 5 seconds
            notificationPollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/phpscript/api_queue.php?action=notifications&userId=${userId}`);
                    const data = await response.json();

                    if (data.success && data.notifications && data.notifications.length > 0) {
                        data.notifications.forEach(async (notif) => {
                            // Show browser notification if permitted
                            if ('Notification' in window && Notification.permission === 'granted') {
                                new Notification('Assistance DAXI', {
                                    body: 'Nous avons répondu à votre message',
                                    icon: 'https://cdn-icons-png.flaticon.com/512/3097/3097049.png',
                                    badge: 'https://cdn-icons-png.flaticon.com/512/3097/3097049.png',
                                    tag: notif.id,
                                    requireInteraction: false
                                });
                            }
                            
                            // Show typing indicator
                            typingIndicator.classList.add('active');
                            scrollToBottom();
                            
                            // Simulate typing delay (3 seconds)
                            await new Promise(resolve => setTimeout(resolve, 3000));
                            
                            // Hide typing indicator
                            typingIndicator.classList.remove('active');
                            
                            // Add assistant response
                            addMessage('assistant', notif.response);

                            // Update history
                            conversationHistory.push({
                                role: 'assistant',
                                content: notif.response
                            });

                            // Save to storage
                            saveConversationToStorage();

                            // Mark notification as read
                            fetch(`/phpscript/api_queue.php?action=mark_read&userId=${userId}&notifId=${notif.id}`);
                        });
                    }
                } catch (error) {
                    console.error('Notification poll error:', error);
                }
            }, 5000);
        }

        // Save conversation to localStorage and Firebase
        function saveConversationToStorage() {
            // Save locally
            localStorage.setItem(`chat_history_${userId}`, JSON.stringify(conversationHistory));
            
            // Save to Firebase via API
            fetch('/phpscript/save_chat.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: userId,
                    history: conversationHistory
                })
            }).catch(err => console.error('Failed to save to Firebase:', err));
        }

        // Load conversation from localStorage
        function loadConversationFromStorage() {
            const saved = localStorage.getItem(`chat_history_${userId}`);
            if (saved) {
                try {
                    conversationHistory = JSON.parse(saved);
                    
                    // Display saved messages
                    conversationHistory.forEach(msg => {
                        addMessage(msg.role, msg.content);
                    });
                } catch (e) {
                    console.error('Failed to load history:', e);
                }
            }
        }

        // Remove system message by messageId (kept for compatibility)
        function removeSystemMessage(messageId) {
            const systemMsg = document.querySelector(`.message.system[data-message-id="${messageId}"]`);
            if (systemMsg) {
                systemMsg.remove();
            }
        }

        // Add message to chat
        function addMessage(role, content, messageId = null) {
            // Remove welcome message if exists
            const welcomeMsg = chatMessages.querySelector('.welcome-message');
            if (welcomeMsg) {
                welcomeMsg.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            // Add data attribute for system messages
            if (role === 'system' && messageId) {
                messageDiv.setAttribute('data-message-id', messageId);
            }

            const avatar = role === 'user' ? 
                '<i class="ri-user-line"></i>' : 
                role === 'system' ?
                '<i class="ri-time-line"></i>' :
                '<i class="ri-customer-service-2-line"></i>';

            const time = new Date().toLocaleTimeString('fr-FR', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });

            messageDiv.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div>
                    <div class="message-bubble">${content}</div>
                    <div class="message-time">${time}</div>
                </div>
            `;

            chatMessages.insertBefore(messageDiv, typingIndicator);
            scrollToBottom();
        }

        // Scroll to bottom
        function scrollToBottom() {
            setTimeout(() => {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 100);
        }

        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Auto-focus input
        chatInput.focus();
    </script>
</body>
</html>
