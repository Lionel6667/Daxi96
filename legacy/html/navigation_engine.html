<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DAXI Navigation</title>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Inter", sans-serif;
            background: #0d1117;
        }
        #map { position: absolute; inset: 0; }

        .mapboxgl-ctrl-attrib,
        .mapboxgl-ctrl-logo,
        .mapboxgl-ctrl-bottom-left,
        .mapboxgl-ctrl-bottom-right {
            display: none !important;
        }

        .car-el {
            width: 40px;
            height: 72px;
            filter:
                drop-shadow(0 0 10px rgba(99, 179, 237, 0.9))
                drop-shadow(0 0 24px rgba(59, 130, 246, 0.55));
        }

        .intro-overlay {
            position: absolute;
            inset: 0;
            z-index: 90;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 50%, rgba(5, 8, 14, 0.08), rgba(5, 8, 14, 0.72)),
                linear-gradient(180deg, rgba(2, 6, 23, 0.18) 0%, rgba(2, 6, 23, 0.75) 100%);
            transition: opacity 0.75s ease, visibility 0.75s ease;
        }
        .intro-overlay.done {
            opacity: 0;
            visibility: hidden;
        }
        .intro-card {
            width: min(92vw, 460px);
            border-radius: 18px;
            padding: 18px 20px 16px;
            background: rgba(6, 9, 18, 0.9);
            border: 1px solid rgba(59, 130, 246, 0.35);
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.55);
            color: #e2e8f0;
        }
        .intro-title {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.6px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .intro-metrics {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 14px;
        }
        .intro-metric-label {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #64748b;
            margin-bottom: 4px;
        }
        .intro-metric-value {
            font-size: 31px;
            font-weight: 900;
            color: #f8fafc;
            line-height: 1;
        }
        .intro-sub {
            font-size: 12px;
            font-weight: 600;
            color: #93c5fd;
            margin-bottom: 10px;
        }
        .intro-progress {
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.2);
            overflow: hidden;
        }
        .intro-progress > span {
            display: block;
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg, #60a5fa, #818cf8);
        }

        .hud {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.55s ease, visibility 0.55s ease;
        }
        .hud.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            padding: 14px 14px 0;
            pointer-events: none;
            animation: dropIn 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
        }
        .instruction {
            background: rgba(8, 12, 22, 0.96);
            backdrop-filter: blur(24px) saturate(1.6);
            border: 1px solid rgba(139, 92, 246, 0.28);
            border-radius: 20px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 10px 36px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            color: white;
        }
        .instr-icon {
            width: 54px;
            height: 54px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #5b21b6 0%, #2563eb 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 18px rgba(91, 33, 182, 0.65);
        }
        .instr-dist {
            font-size: 30px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.5px;
        }
        .instr-road {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .speed-pill {
            position: absolute;
            left: 18px;
            z-index: 50;
            bottom: 170px;
            background: rgba(8, 12, 22, 0.96);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(167, 139, 250, 0.28);
            border-radius: 20px;
            width: 74px;
            height: 74px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
            animation: slideRight 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both;
        }
        .speed-num {
            font-size: 30px;
            font-weight: 900;
            line-height: 1;
            color: #a78bfa;
        }
        .speed-lbl {
            font-size: 8px;
            font-weight: 700;
            color: #475569;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            margin-top: 3px;
        }

        .bottom-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background: rgba(6, 9, 18, 0.97);
            backdrop-filter: blur(24px);
            border-top: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 28px 28px 0 0;
            padding: 22px 26px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 -10px 48px rgba(0, 0, 0, 0.7);
            animation: riseUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
        }
        .stat {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .stat-lbl {
            font-size: 9px;
            font-weight: 700;
            color: #334155;
            text-transform: uppercase;
            letter-spacing: 1.8px;
        }
        .stat-val {
            font-size: 26px;
            font-weight: 900;
            color: white;
            letter-spacing: -0.5px;
        }
        .eta-badge {
            background: linear-gradient(145deg, #4c1d95, #3730a3 60%, #1e3a8a);
            border-radius: 18px;
            padding: 11px 22px;
            text-align: center;
            box-shadow: 0 5px 24px rgba(76, 29, 149, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        .eta-lbl {
            font-size: 9px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }
        .eta-val {
            font-size: 28px;
            font-weight: 900;
            color: white;
            letter-spacing: -0.5px;
        }

        .nav-tools {
            position: absolute;
            right: 14px;
            bottom: 182px;
            z-index: 60;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .nav-btn {
            width: 48px;
            height: 48px;
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 14px;
            background: rgba(8, 12, 22, 0.92);
            color: #f1f5f9;
            font-size: 24px;
            font-weight: 800;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
        }
        .nav-btn:active { transform: translateY(1px); }
        .nav-btn.center {
            font-size: 18px;
            color: #93c5fd;
        }

        @keyframes dropIn { from { transform: translateY(-130px); opacity: 0; } to { transform: none; opacity: 1; } }
        @keyframes riseUp { from { transform: translateY(170px); } to { transform: none; } }
        @keyframes slideRight { from { transform: translateX(-100px); opacity: 0; } to { transform: none; opacity: 1; } }
    </style>
</head>
<body>
<div id="map"></div>

<div class="intro-overlay" id="intro-overlay">
    <div class="intro-card">
        <div class="intro-title">Apercu Itineraire</div>
        <div class="intro-metrics">
            <div>
                <span class="intro-metric-label">Distance</span>
                <span class="intro-metric-value" id="intro-km">0.0 km</span>
            </div>
            <div style="text-align:right">
                <span class="intro-metric-label">Temps</span>
                <span class="intro-metric-value" id="intro-min">0 min</span>
            </div>
        </div>
        <div class="intro-sub">Vue aerienne complete avant passage en mode conduite 3D</div>
        <div class="intro-progress"><span id="intro-progress"></span></div>
    </div>
</div>

<div id="nav-hud" class="hud hidden">
    <div class="top-bar">
        <div class="instruction">
            <div class="instr-icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 10 4 15 9 20"/>
                    <path d="M20 4v7a4 4 0 0 1-4 4H4"/>
                </svg>
            </div>
            <div>
                <div class="instr-dist" id="turn-dist">170 m</div>
                <div class="instr-road" id="turn-road">Blvd T. Louverture</div>
            </div>
        </div>
    </div>

    <div class="speed-pill">
        <div class="speed-num" id="spd">0</div>
        <div class="speed-lbl">km/h</div>
    </div>

    <div class="bottom-panel">
        <div class="stat">
            <span class="stat-lbl">Temps</span>
            <span class="stat-val" id="eta-min">8 min</span>
        </div>
        <div class="eta-badge">
            <div class="eta-lbl">Arrivee</div>
            <div class="eta-val" id="eta-clk">14:12</div>
        </div>
        <div class="stat" style="text-align:right">
            <span class="stat-lbl">Distance</span>
            <span class="stat-val" id="rem-dist">1.8 km</span>
        </div>
    </div>

    <div class="nav-tools">
        <button class="nav-btn" id="zoom-in-btn" aria-label="Zoom in">+</button>
        <button class="nav-btn" id="zoom-out-btn" aria-label="Zoom out">-</button>
        <button class="nav-btn center" id="center-btn" aria-label="Recenter">◎</button>
    </div>
</div>

<script>
mapboxgl.accessToken = window.MAPBOX_ACCESS_TOKEN || ""; // set via env / Railway MAPBOX_ACCESS_TOKEN

const ROUTE = [
    [-72.3364, 18.5392], [-72.3366, 18.5404], [-72.3368, 18.5418],
    [-72.3372, 18.5430], [-72.3382, 18.5433], [-72.3396, 18.5434],
    [-72.3410, 18.5435], [-72.3416, 18.5436], [-72.3418, 18.5450],
    [-72.3420, 18.5462], [-72.3434, 18.5467], [-72.3450, 18.5471],
    [-72.3464, 18.5484], [-72.3478, 18.5497], [-72.3490, 18.5510]
];

const STREET_NAMES = [
    "Blvd Toussaint Louverture",
    "Rue Monseigneur Guilloux",
    "Avenue John Brown",
    "Route de Delmas",
    "Boulevard La Saline"
];

const CFG = {
    introMs: 5000,
    introPadding: { top: 70, bottom: 70, left: 56, right: 56 },
    introMinZoom: 8.7,
    drivePitch: 65,
    navZoomDefault: 16.2,
    navZoomMin: 13.6,
    navZoomMax: 18.4,
    carSpeed: 0.0125,
    bearSmooth: 0.075,
    camSmooth: 0.105,
    zoomSmooth: 0.085,
    lookAhead: 0.00092,
    stepDist: 0.000065,
    drivePadding: { top: 86, bottom: 300, left: 0, right: 0 },
    enterDriveMs: 2200,
    avgSpeedKmh: 32
};

const ui = {
    hud: document.getElementById("nav-hud"),
    intro: document.getElementById("intro-overlay"),
    introKm: document.getElementById("intro-km"),
    introMin: document.getElementById("intro-min"),
    introProgress: document.getElementById("intro-progress"),
    turnDist: document.getElementById("turn-dist"),
    turnRoad: document.getElementById("turn-road"),
    speed: document.getElementById("spd"),
    remDist: document.getElementById("rem-dist"),
    etaMin: document.getElementById("eta-min"),
    etaClk: document.getElementById("eta-clk"),
    zoomIn: document.getElementById("zoom-in-btn"),
    zoomOut: document.getElementById("zoom-out-btn"),
    center: document.getElementById("center-btn")
};

const FLOW_SEQ = [
    [0, 4, 3], [0.5, 4, 2.5], [1, 4, 2], [1.5, 4, 1.5], [2, 4, 1], [2.5, 4, 0.5], [3, 4, 0],
    [0, 0.5, 3, 3.5], [0, 1, 3, 3], [0, 1.5, 3, 2.5], [0, 2, 3, 2], [0, 2.5, 3, 1.5], [0, 3, 3, 1], [0, 3.5, 3, 0.5]
];

let map;
let mode = "intro";
let introStart = 0;
let flowIdx = -1;
let cameraInternalChange = false;
let step = 0;
let pos = [...ROUTE[0]];
let bear = 0;
let sBear = 0;
let camC = [...ROUTE[0]];
let camB = 0;
let camZ = CFG.navZoomDefault;
let targetZoom = CFG.navZoomDefault;
let lastT = 0;
let _userHeading = 0;
let _hasDeviceOrientation = false;

window.addEventListener('deviceorientationabsolute', function(e) {
    if (e.alpha !== null || e.webkitCompassHeading !== undefined) {
        _hasDeviceOrientation = true;
        _userHeading = e.webkitCompassHeading || e.alpha || 0;
    }
}, true);

window.addEventListener('deviceorientation', function(e) {
    if (e.webkitCompassHeading !== undefined) {
        _hasDeviceOrientation = true;
        _userHeading = e.webkitCompassHeading;
    }
}, true);

const toRad = d => d * Math.PI / 180;
const toDeg = r => r * 180 / Math.PI;
const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => t * t * (3 - 2 * t);

function calcBearing(a, b) {
    const lat1 = toRad(a[1]);
    const lat2 = toRad(b[1]);
    const dLng = toRad(b[0] - a[0]);
    const y = Math.sin(dLng) * Math.cos(lat2);
    const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

function lerpBear(a, b, t) {
    return (a + (((b - a + 540) % 360) - 180) * t + 360) % 360;
}

function lookAheadPt(p, bearDeg, off) {
    const r = toRad(bearDeg);
    return [p[0] + Math.sin(r) * off, p[1] + Math.cos(r) * off];
}

function shortAngleDiff(a, b) {
    return ((b - a + 540) % 360) - 180;
}

function haversineKm(a, b) {
    const dLat = toRad(b[1] - a[1]);
    const dLng = toRad(b[0] - a[0]);
    const lat1 = toRad(a[1]);
    const lat2 = toRad(b[1]);
    const s = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
    return 6371 * 2 * Math.asin(Math.sqrt(s));
}

const SEGMENT_KM = ROUTE.slice(0, -1).map((p, i) => haversineKm(p, ROUTE[i + 1]));
const TOTAL_KM = SEGMENT_KM.reduce((sum, km) => sum + km, 0);
const TOTAL_MIN = Math.max(2, Math.round((TOTAL_KM / CFG.avgSpeedKmh) * 60));

function getRouteBounds() {
    const bounds = new mapboxgl.LngLatBounds(ROUTE[0], ROUTE[0]);
    ROUTE.forEach(coord => bounds.extend(coord));
    return bounds;
}

function getDistanceLabel(km) {
    if (km >= 10) return `${km.toFixed(0)} km`;
}

const CAR_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 72" width="40" height="72">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f4ad6"/>
      <stop offset="48%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#0f4ad6"/>
    </linearGradient>
  </defs>
  <ellipse cx="20" cy="69" rx="13" ry="3.2" fill="rgba(0,0,0,0.3)"/>
  <path d="M8,56 L7.5,21 Q7.5,7 20,7 Q32.5,7 32.5,21 L32,56 Q32,64 20,64 Q8,64 8,56Z" fill="url(#bodyGrad)"/>
  <path d="M13.5,34 L13,20 Q13,13.5 20,13 Q27,13.5 27,20 L26.5,34Z" fill="rgba(26,58,141,0.75)"/>
  <path d="M14,19 Q14,11 20,10.5 Q26,11 26,19 L24.5,30.5 Q20,32.5 15.5,30.5Z" fill="rgba(186,230,253,0.72)" stroke="rgba(255,255,255,0.18)" stroke-width="0.4"/>
  <path d="M15,50 L15.5,42 Q20,40.5 24.5,42 L25,50 Q20,53 15,50Z" fill="rgba(186,230,253,0.45)"/>
  <path d="M9.5,28 Q9.5,22 11,18 L11,52 Q9.5,48 9.5,40Z" fill="rgba(255,255,255,0.07)"/>
  <rect x="1.5" y="17" width="7" height="13" rx="3.5" fill="#0c1422"/><rect x="2.5" y="18" width="5" height="11" rx="2.5" fill="#1c3461"/>
  <rect x="1.5" y="43" width="7" height="13" rx="3.5" fill="#0c1422"/><rect x="2.5" y="44" width="5" height="11" rx="2.5" fill="#1c3461"/>
  <rect x="31.5" y="17" width="7" height="13" rx="3.5" fill="#0c1422"/><rect x="32.5" y="18" width="5" height="11" rx="2.5" fill="#1c3461"/>
  <rect x="31.5" y="43" width="7" height="13" rx="3.5" fill="#0c1422"/><rect x="32.5" y="44" width="5" height="11" rx="2.5" fill="#1c3461"/>
  <rect x="11" y="7.5" width="5.5" height="3.5" rx="1.5" fill="#fde68a"/><rect x="23.5" y="7.5" width="5.5" height="3.5" rx="1.5" fill="#fde68a"/>
  <rect x="11" y="61" width="5.5" height="3.5" rx="1.5" fill="#f87171"/><rect x="23.5" y="61" width="5.5" height="3.5" rx="1.5" fill="#f87171"/>
</svg>`;

function applyMinimalRoadStyle() {
    const hiddenKeywords = [
        "poi", "building", "airport", "transit", "landmark", "park",
        "settlement", "place-label", "waterway-label", "natural-label",
        "road-label", "housenum", "pedestrian", "rail"
    ];

    map.getStyle().layers.forEach(layer => {
        const isClutter = layer.type === "symbol" ||
            layer.type === "fill-extrusion" ||
            hiddenKeywords.some(key => layer.id.includes(key));

        if (isClutter) {
            try { map.setLayoutProperty(layer.id, "visibility", "none"); } catch (_) {}
            return;
        }

        if (layer.type === "line" && layer.id.includes("road")) {
            try { map.setPaintProperty(layer.id, "line-color", "#22303f"); } catch (_) {}
            try { map.setPaintProperty(layer.id, "line-opacity", 0.82); } catch (_) {}
        }
    });
}

function addRouteLayers() {
    const routeGeo = {
        type: "Feature",
        geometry: { type: "LineString", coordinates: ROUTE }
    };

    map.addSource("route-src", { type: "geojson", data: routeGeo });
    map.addLayer({
        id: "route-glow-wide",
        type: "line",
        source: "route-src",
        layout: { "line-join": "round", "line-cap": "round" },
        paint: {
            "line-color": "#4c1d95",
            "line-width": ["interpolate", ["linear"], ["zoom"], 8, 14, 18, 46],
            "line-opacity": 0.18,
            "line-blur": 20
        }
    });
    map.addLayer({
        id: "route-glow-core",
        type: "line",
        source: "route-src",
        layout: { "line-join": "round", "line-cap": "round" },
        paint: {
            "line-color": "#6366f1",
            "line-width": ["interpolate", ["linear"], ["zoom"], 8, 7, 18, 22],
            "line-opacity": 0.38,
            "line-blur": 10
        }
    });
    map.addLayer({
        id: "route-main",
        type: "line",
        source: "route-src",
        layout: { "line-join": "round", "line-cap": "round" },
        paint: {
            "line-color": "#dbeafe",
            "line-width": ["interpolate", ["linear"], ["zoom"], 8, 3.8, 18, 11]
        }
    });
    map.addLayer({
        id: "route-core",
        type: "line",
        source: "route-src",
        layout: { "line-join": "round", "line-cap": "round" },
        paint: {
            "line-color": "#93c5fd",
            "line-width": ["interpolate", ["linear"], ["zoom"], 8, 1.2, 18, 4.2],
            "line-opacity": 0.95
        }
    });
    map.addLayer({
        id: "route-flow",
        type: "line",
        source: "route-src",
        layout: { "line-join": "round", "line-cap": "round" },
        paint: {
            "line-color": "#ffffff",
            "line-width": ["interpolate", ["linear"], ["zoom"], 8, 1.6, 18, 5.5],
            "line-opacity": 0.55,
            "line-dasharray": [0, 4, 3]
        }
    });
}

function setZoomTarget(nextZoom) {
    targetZoom = clamp(nextZoom, CFG.navZoomMin, CFG.navZoomMax);
}

function showHud() {
    ui.hud.classList.remove("hidden");
}

function hideIntro() {
    ui.intro.classList.add("done");
}

function getTravelledKm() {
    let km = 0;
    for (let i = 0; i < step; i += 1) km += SEGMENT_KM[i] || 0;

    if (step < ROUTE.length - 1) {
        const segLen = SEGMENT_KM[step] || 0;
        if (segLen > 0) {
            const doneOnSeg = haversineKm(ROUTE[step], pos);
            km += Math.min(doneOnSeg / segLen, 1) * segLen;
        }
    }
    return km;
}

function updateUi(ts, next) {
    const travelledKm = Math.min(getTravelledKm(), TOTAL_KM);
    const remKm = Math.max(TOTAL_KM - travelledKm, 0);
    const progress = TOTAL_KM > 0 ? travelledKm / TOTAL_KM : 1;
    const remMin = Math.max(1, Math.round(TOTAL_MIN * (1 - progress)));
    const etaDate = new Date(Date.now() + remMin * 60000);
    const hh = String(etaDate.getHours()).padStart(2, "0");
    const mm = String(etaDate.getMinutes()).padStart(2, "0");
    const speed = 35 + Math.sin(ts * 0.0012) * 7 + (Math.random() - 0.5) * 2.3;
    const turnMeters = Math.max(20, Math.round(haversineKm(pos, next) * 1000));

    ui.speed.textContent = Math.round(speed);
    ui.remDist.textContent = getDistanceLabel(remKm);
    ui.etaMin.textContent = `${remMin} min`;
    ui.etaClk.textContent = `${hh}:${mm}`;
    ui.turnDist.textContent = turnMeters >= 1000 ? `${(turnMeters / 1000).toFixed(1)} km` : `${turnMeters} m`;
    ui.turnRoad.textContent = STREET_NAMES[step % STREET_NAMES.length];
}

function tickFlow(ts) {
    const idx = Math.floor(ts / 58) % FLOW_SEQ.length;
    if (idx !== flowIdx && map && map.getLayer("route-flow")) {
        flowIdx = idx;
        map.setPaintProperty("route-flow", "line-dasharray", FLOW_SEQ[idx]);
        const pulse = 0.46 + Math.sin(ts * 0.004) * 0.16;
        map.setPaintProperty("route-flow", "line-opacity", pulse);
    }

    if (mode === "intro") {
        const progress = clamp((ts - introStart) / CFG.introMs, 0, 1);
        ui.introProgress.style.width = `${(progress * 100).toFixed(1)}%`;
    }
    requestAnimationFrame(tickFlow);
}

function startDriveMode() {
    mode = "transition";
    showHud();
    hideIntro();

    step = 0;
    pos = [...ROUTE[0]];
    bear = calcBearing(ROUTE[0], ROUTE[1]);
    sBear = bear;
    camB = bear;
    camC = lookAheadPt(pos, sBear, CFG.lookAhead);
    camZ = map.getZoom();
    targetZoom = CFG.navZoomDefault;

    map.setPadding(CFG.drivePadding);
    map.easeTo({
        center: camC,
        zoom: targetZoom,
        bearing: camB,
        pitch: CFG.drivePitch,
        duration: CFG.enterDriveMs,
        essential: true,
        easing: t => 1 - Math.pow(1 - t, 3)
    });

    let started = false;
    const beginEngine = () => {
        if (started) return;
        started = true;
        mode = "drive";
        lastT = 0;
        requestAnimationFrame(engine);
    };

    map.once("moveend", beginEngine);
    setTimeout(beginEngine, CFG.enterDriveMs + 80);
}

function playIntroCinematic() {
    const bounds = getRouteBounds();
    map.fitBounds(bounds, {
        padding: CFG.introPadding,
        duration: 0
    });

    const aerialZoom = Math.max(CFG.introMinZoom, map.getZoom() - 1.15);
    map.jumpTo({
        center: bounds.getCenter(),
        zoom: aerialZoom,
        pitch: 0,
        bearing: 0,
        padding: CFG.introPadding
    });

    map.easeTo({
        center: bounds.getCenter(),
        zoom: aerialZoom - 0.2,
        pitch: 0,
        bearing: -12,
        duration: CFG.introMs,
        essential: true,
        easing: easeInOut
    });

    setTimeout(startDriveMode, CFG.introMs);
}

function engine(ts) {
    if (mode !== "drive") return;
    const dt = lastT ? Math.min((ts - lastT) / 16.67, 3) : 1;
    lastT = ts;

    if (step >= ROUTE.length - 1) {
        step = 0;
        pos = [...ROUTE[0]];
        bear = calcBearing(ROUTE[0], ROUTE[1]);
        sBear = bear;
    }

    const next = ROUTE[step + 1] || ROUTE[ROUTE.length - 1];
    const moveT = Math.min(CFG.carSpeed * dt, 1);
    pos[0] = lerp(pos[0], next[0], moveT);
    pos[1] = lerp(pos[1], next[1], moveT);

    const latDelta = pos[1] - next[1];
    const lngDelta = pos[0] - next[0];
    if (Math.sqrt((lngDelta * lngDelta) + (latDelta * latDelta)) < CFG.stepDist) step += 1;

    if (step < ROUTE.length - 1) bear = calcBearing(ROUTE[step], ROUTE[step + 1]);
    sBear = lerpBear(sBear, bear, CFG.bearSmooth * dt);

    const focal = lookAheadPt(pos, sBear, CFG.lookAhead);
    camC[0] = lerp(camC[0], focal[0], CFG.camSmooth * dt);
    camC[1] = lerp(camC[1], focal[1], CFG.camSmooth * dt);
    const targetCamB = _hasDeviceOrientation ? _userHeading : sBear;
    camB = lerpBear(camB, targetCamB, CFG.camSmooth * dt);
    camZ = lerp(camZ, targetZoom, CFG.zoomSmooth * dt);

    cameraInternalChange = true;
    map.jumpTo({
        center: camC,
        bearing: camB,
        pitch: CFG.drivePitch,
        zoom: camZ,
        padding: CFG.drivePadding
    });
    cameraInternalChange = false;

    if (map.getSource('car-source')) {
        let finalCarRotation = sBear;
        if (_hasDeviceOrientation) {
            finalCarRotation = _userHeading;
        }
        map.getSource('car-source').setData({
            type: 'Feature',
            geometry: {
                type: 'Point',
                coordinates: pos
            },
            properties: {
                bearing: finalCarRotation
            }
        });
    }

    updateUi(ts, next);
    requestAnimationFrame(engine);
}

function init() {
    map = new mapboxgl.Map({
        container: "map",
        style: "mapbox://styles/chesthedly/cmogw21ai007501r49272a8z7",
        center: ROUTE[0],
        zoom: CFG.navZoomDefault,
        pitch: CFG.drivePitch,
        bearing: 0,
        antialias: true,
        interactive: true,
        fadeDuration: 0
    });

    map.on("load", () => {
        applyMinimalRoadStyle();
        addRouteLayers();

        map.loadImage('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(CAR_SVG), (err, image) => {
            if (err) throw err;
            map.addImage('car-icon', image);
            
            map.addSource('car-source', {
                type: 'geojson',
                data: {
                    type: 'Feature',
                    geometry: { type: 'Point', coordinates: ROUTE[0] },
                    properties: { bearing: 0 }
                }
            });

            map.addLayer({
                id: 'car-layer',
                type: 'symbol',
                source: 'car-source',
                layout: {
                    'icon-image': 'car-icon',
                    'icon-size': 1.0,
                    'icon-rotate': ['get', 'bearing'],
                    'icon-rotation-alignment': 'map',
                    'icon-pitch-alignment': 'map',
                    'icon-allow-overlap': true,
                    'icon-ignore-placement': true
                }
            });
        });

        map.dragRotate.disable();
        map.touchZoomRotate.disableRotation();
        map.keyboard.disable();
        map.doubleClickZoom.disable();

        ui.introKm.textContent = getDistanceLabel(TOTAL_KM);
        ui.introMin.textContent = `${TOTAL_MIN} min`;
        ui.remDist.textContent = getDistanceLabel(TOTAL_KM);
        ui.etaMin.textContent = `${TOTAL_MIN} min`;

        const etaDate = new Date(Date.now() + TOTAL_MIN * 60000);
        ui.etaClk.textContent = `${String(etaDate.getHours()).padStart(2, "0")}:${String(etaDate.getMinutes()).padStart(2, "0")}`;

        ui.zoomIn.addEventListener("click", () => setZoomTarget(targetZoom + 0.5));
        ui.zoomOut.addEventListener("click", () => setZoomTarget(targetZoom - 0.5));
        ui.center.addEventListener("click", () => setZoomTarget(CFG.navZoomDefault));

        map.on("zoom", () => {
            if (mode !== "drive" || cameraInternalChange) return;
            setZoomTarget(map.getZoom());
            camZ = targetZoom;
        });

        introStart = performance.now();
        requestAnimationFrame(tickFlow);
        playIntroCinematic();
    });
}

init();
</script>
</body>
</html>
