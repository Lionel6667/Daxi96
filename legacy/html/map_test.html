<!DOCTYPE html>
<html>
<head>
    <title>Map Test</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB_KKEieIETER3FID4nGetmT2aFXGc9n6A&v=beta&callback=initMap&loading=async" async></script>
    <style>
        #map { width: 100vw; height: 100vh; position: absolute; top:0; left:0; }
        body { margin: 0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        function initMap() {
            try {
                const map = new google.maps.Map(document.getElementById('map'), {
                    center: {lat: 18.5333, lng: -72.3333},
                    zoom: 15,
                    mapId: 'c4948b020bfc08331f1cb94e',
                    tilt: 65,
                    colorScheme: 'DARK'
                });
                console.log("Map initialized successfully");
            } catch(e) {
                console.error("Map error: ", e);
                document.body.innerHTML += "<h1 style='color:red; position:absolute; z-index:99;'>" + e.message + "</h1>";
            }
        }
    </script>
</body>
</html>
