<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#070b14">
  <title>{{ status_code }} — {{ error_title }} · DAXI</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root {
      --bg0: #05070d;
      --bg1: #0b1220;
      --gold: #fbbf24;
      --gold2: #f59e0b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --line: rgba(148,163,184,0.18);
      --card: rgba(15,23,42,0.72);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      min-height: 100dvh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(245,158,11,0.16), transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(59,130,246,0.08), transparent 50%),
        linear-gradient(165deg, var(--bg0), var(--bg1));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .wrap {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 28px 24px 22px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.45);
      backdrop-filter: blur(16px);
      text-align: center;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: var(--gold);
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 18px;
    }
    .brand i { font-size: 20px; }
    .code {
      font-size: clamp(64px, 18vw, 88px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #fff 10%, var(--gold) 55%, var(--gold2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 4px 0 8px;
    }
    .icon-bubble {
      width: 56px; height: 56px; margin: 0 auto 14px;
      border-radius: 16px;
      display: grid; place-items: center;
      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.28);
      color: var(--gold);
      font-size: 26px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 800;
    }
    .lead {
      margin: 0 0 10px;
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.45;
    }
    .hint {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      text-decoration: none;
      border: 1px solid transparent;
      transition: transform .15s ease, opacity .15s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary {
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: #0f172a;
      box-shadow: 0 8px 24px rgba(245,158,11,0.28);
    }
    .btn-ghost {
      background: rgba(255,255,255,0.04);
      border-color: var(--line);
      color: #e2e8f0;
    }
    .debug {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-size: 11px;
      color: #64748b;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main class="wrap" role="alert">
    <a class="brand" href="{{ home_url }}"><i class="ri-taxi-line"></i> DAXI</a>
    <div class="icon-bubble" aria-hidden="true"><i class="{{ error_icon }}"></i></div>
    <div class="code">{{ status_code }}</div>
    <h1>{{ error_title }}</h1>
    <p class="lead">{{ error_lead }}</p>
    <p class="hint">{{ error_hint }}</p>
    <div class="actions">
      <a class="btn btn-primary" href="{{ home_url }}"><i class="ri-home-5-line"></i> Accueil</a>
      <a class="btn btn-ghost" href="javascript:history.back()"><i class="ri-arrow-go-back-line"></i> Retour</a>
      <a class="btn btn-ghost" href="{{ support_url }}"><i class="ri-customer-service-2-line"></i> Assistance</a>
    </div>
    {% if show_debug_bits and exception_name %}
    <div class="debug">Exception: {{ exception_name }}</div>
    {% endif %}
  </main>
</body>
</html>
