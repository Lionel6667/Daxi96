<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erreur de paiement · Daxi</title>
<link rel="icon" href="/assets/images/daxi-logo-gold.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #f1f5f9;
    padding: 24px;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .icon { font-size: 48px; margin-bottom: 20px; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 12px; color: #f8fafc; }
  p  { font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 28px; }
  .btn {
    display: inline-block;
    padding: 12px 28px;
    background: #f59e0b;
    color: #0f172a;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    text-decoration: none;
  }
  .btn:hover { background: #d97706; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">⚠️</div>
    <h1>Paiement indisponible</h1>
    <p>{{ message|default:"Une erreur est survenue lors de l'initialisation du paiement. Veuillez réessayer." }}</p>
    <a href="/" class="btn">Retour à l'accueil</a>
  </div>
</body>
</html>
