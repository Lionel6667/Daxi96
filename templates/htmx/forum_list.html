{% load static %}

<div id="forum-container">
  {% if not posts %}
  <div style="text-align:center; padding:40px; color:#9ca3af;">
    <div style="font-size:40px; margin-bottom:8px;">📰</div>
    <p>Aucune publication pour le moment</p>
  </div>
  {% endif %}

  {% for post in posts %}
  <div id="forum-post-{{ post.id }}"
       style="background:white; border:1px solid #e5e7eb; border-left:4px solid {{ post.color|default:'#667eea' }}; border-radius:12px; padding:16px; margin-bottom:12px; cursor:pointer;"
       hx-get="/htmx/forum/{{ post.id }}/"
       hx-target="#forum-detail-panel"
       hx-swap="innerHTML">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
      <div style="flex:1; min-width:0;">
        <div style="font-size:15px; font-weight:700; color:#1f2937; margin-bottom:4px;">{{ post.title }}</div>
        {% if post.content %}
        <div style="font-size:13px; color:#6b7280; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
          {{ post.content|truncatechars:100 }}
        </div>
        {% endif %}
        <div style="font-size:11px; color:#9ca3af; margin-top:6px;">
          📅 {{ post.created_at|date:"d/m/Y H:i" }}
        </div>
      </div>
      <div style="width:10px; height:10px; border-radius:50%; background:{{ post.color|default:'#667eea' }}; flex-shrink:0; margin-top:5px;"></div>
    </div>
  </div>
  {% endfor %}

  <div id="forum-detail-panel"></div>
</div>
