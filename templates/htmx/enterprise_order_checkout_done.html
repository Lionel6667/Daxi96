<div class="ent-checkout ent-checkout--done">
  <div class="ent-checkout-head ent-checkout-head--ok">
    <i class="ri-checkbox-circle-line"></i>
    <h3>Commande confirmée</h3>
    <p>{{ message }}</p>
  </div>
  <button type="button" class="ent-checkout-btn ent-checkout-btn--gold" onclick="closeEntCheckoutModal(); if(window.loadOrders) loadOrders(window._currentTab||'active');">OK</button>
</div>
