
{% with idx=o.status_pipeline_index|default_if_none:-1 %}
<div class="daxi-oc-pipeline daxi-oc-pipeline--roundtrip daxi-oc-pipeline--{{ o.status }}{% if pipeline_compact %} daxi-oc-pipeline--compact{% endif %}" role="list" aria-label="Progression aller-retour" data-pipeline-index="{{ idx }}">
  <div class="daxi-oc-pipe-step {% if idx == 0 %}is-current{% elif idx|add:0 > 0 %}is-done{% endif %}" title="Réservation créée">
    <span class="daxi-oc-pipe-dot"><i class="ri-file-list-line"></i></span>
    <span class="daxi-oc-pipe-label">Réservation</span>
  </div>
  <div class="daxi-oc-pipe-step {% if idx == 1 %}is-current{% elif idx|add:0 > 1 %}is-done{% endif %}" title="Devis proposé">
    <span class="daxi-oc-pipe-dot"><i class="ri-price-tag-3-line"></i></span>
    <span class="daxi-oc-pipe-label">Devis</span>
  </div>
  <div class="daxi-oc-pipe-step {% if idx == 2 %}is-current{% elif idx|add:0 > 2 %}is-done{% endif %}" title="Prix confirmé">
    <span class="daxi-oc-pipe-dot"><i class="ri-check-line"></i></span>
    <span class="daxi-oc-pipe-label">Confirmé</span>
  </div>
  <div class="daxi-oc-pipe-step {% if idx == 3 %}is-current{% elif idx|add:0 > 3 %}is-done{% endif %}" title="Chauffeur trouvé">
    <span class="daxi-oc-pipe-dot"><i class="ri-user-star-line"></i></span>
    <span class="daxi-oc-pipe-label">Chauffeur</span>
  </div>
  <div class="daxi-oc-pipe-step {% if idx == 4 %}is-current{% elif idx|add:0 > 4 %}is-done{% endif %}" title="Chauffeur en route vers vous">
    <span class="daxi-oc-pipe-dot"><i class="ri-route-line"></i></span>
    <span class="daxi-oc-pipe-label">En route</span>
  </div>
  <div class="daxi-oc-pipe-step {% if idx == 5 %}is-current{% elif idx|add:0 > 5 %}is-done{% endif %}" title="Client récupéré (aller)">
    <span class="daxi-oc-pipe-dot"><i class="ri-map-pin-user-line"></i></span>
    <span class="daxi-oc-pipe-label">Récupéré</span>
  </div>
  <div class="daxi-oc-pipe-step {% if idx == 6 %}is-current{% elif idx|add:0 > 6 %}is-done{% endif %}" title="Aller en cours vers la destination">
    <span class="daxi-oc-pipe-dot"><i class="ri-steering-2-line"></i></span>
    <span class="daxi-oc-pipe-label">Aller</span>
  </div>
  <div class="daxi-oc-pipe-step {% if idx == 7 %}is-current{% elif idx|add:0 > 7 %}is-done{% endif %}" title="Attente avant le retour">
    <span class="daxi-oc-pipe-dot"><i class="ri-hourglass-line"></i></span>
    <span class="daxi-oc-pipe-label">Attente</span>
  </div>
  <div class="daxi-oc-pipe-step {% if idx == 8 %}is-current{% elif idx|add:0 > 8 %}is-done{% endif %}" title="Retour en cours">
    <span class="daxi-oc-pipe-dot"><i class="ri-arrow-go-back-line"></i></span>
    <span class="daxi-oc-pipe-label">Retour</span>
  </div>
  <div class="daxi-oc-pipe-step {% if idx == 9 %}is-current{% elif idx|add:0 > 9 %}is-done{% endif %}" title="Course terminée">
    <span class="daxi-oc-pipe-dot"><i class="ri-check-double-line"></i></span>
    <span class="daxi-oc-pipe-label">Terminé</span>
  </div>
</div>
{% endwith %}
