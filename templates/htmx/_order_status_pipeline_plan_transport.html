
{% with idx=o.status_pipeline_index|default_if_none:-1 %}
<div class="daxi-oc-pipeline daxi-oc-pipeline--plan daxi-oc-pipeline--plan-transport daxi-oc-pipeline--{{ o.status }}{% if pipeline_compact %} daxi-oc-pipeline--compact{% endif %}" role="list" aria-label="Progression forfait transfert" data-pipeline-index="{{ idx }}">
  <div class="daxi-oc-pipe-step {% if idx == 0 %}is-current{% elif idx|add:0 > 0 %}is-done{% endif %}" title="Réservation forfait">
    <span class="daxi-oc-pipe-dot"><i class="ri-file-list-line"></i></span>
    <span class="daxi-oc-pipe-label">Réservation</span>
  </div>
  <div class="daxi-oc-pipe-step {% if idx == 1 %}is-current{% elif idx|add:0 > 1 %}is-done{% endif %}" title="Devis forfait">
    <span class="daxi-oc-pipe-dot"><i class="ri-price-tag-3-line"></i></span>
    <span class="daxi-oc-pipe-label">Devis</span>
  </div>
  <div class="daxi-oc-pipe-step {% if idx == 2 %}is-current{% elif idx|add:0 > 2 %}is-done{% endif %}" title="Forfait confirmé">
    <span class="daxi-oc-pipe-dot"><i class="ri-check-line"></i></span>
    <span class="daxi-oc-pipe-label">Confirmé</span>
  </div>
  <div class="daxi-oc-pipe-step {% if idx == 3 %}is-current{% elif idx|add:0 > 3 %}is-done{% endif %}" title="Chauffeur assigné">
    <span class="daxi-oc-pipe-dot"><i class="ri-user-star-line"></i></span>
    <span class="daxi-oc-pipe-label">Chauffeur</span>
  </div>
  <div class="daxi-oc-pipe-step {% if idx == 4 %}is-current{% elif idx|add:0 > 4 %}is-done{% endif %}" title="Chauffeur en route">
    <span class="daxi-oc-pipe-dot"><i class="ri-route-line"></i></span>
    <span class="daxi-oc-pipe-label">En route</span>
  </div>
  <div class="daxi-oc-pipe-step {% if idx == 5 %}is-current{% elif idx|add:0 > 5 %}is-done{% endif %}" title="Prise en charge">
    <span class="daxi-oc-pipe-dot"><i class="ri-map-pin-user-line"></i></span>
    <span class="daxi-oc-pipe-label">Prise en charge</span>
  </div>
  <div class="daxi-oc-pipe-step {% if idx == 6 %}is-current{% elif idx|add:0 > 6 %}is-done{% endif %}" title="Trajet en cours">
    <span class="daxi-oc-pipe-dot"><i class="ri-steering-2-line"></i></span>
    <span class="daxi-oc-pipe-label">Trajet</span>
  </div>
  <div class="daxi-oc-pipe-step {% if idx == 7 %}is-current{% elif idx|add:0 > 7 %}is-done{% endif %}" title="Service terminé">
    <span class="daxi-oc-pipe-dot"><i class="ri-check-double-line"></i></span>
    <span class="daxi-oc-pipe-label">Terminé</span>
  </div>
</div>
{% endwith %}
