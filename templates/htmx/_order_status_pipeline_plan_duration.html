
{% with idx=o.status_pipeline_index|default_if_none:-1 %}
<div class="daxi-oc-pipeline daxi-oc-pipeline--plan daxi-oc-pipeline--plan-duration daxi-oc-pipeline--{{ o.status }}{% if pipeline_compact %} daxi-oc-pipeline--compact{% endif %}" role="list" aria-label="Progression forfait durée" data-pipeline-index="{{ idx }}">
  <div class="daxi-oc-pipe-step {% if idx == 0 %}is-current{% elif idx|add:0 > 0 %}is-done{% endif %}" title="Demande forfait">
    <span class="daxi-oc-pipe-dot"><i class="ri-file-list-line"></i></span>
    <span class="daxi-oc-pipe-label">Demande</span>
  </div>
  <div class="daxi-oc-pipe-step {% if idx == 1 %}is-current{% elif idx|add:0 > 1 %}is-done{% endif %}" title="Forfait validé">
    <span class="daxi-oc-pipe-dot"><i class="ri-check-line"></i></span>
    <span class="daxi-oc-pipe-label">Validé</span>
  </div>
  <div class="daxi-oc-pipe-step {% if idx == 2 %}is-current{% elif idx|add:0 > 2 %}is-done{% endif %}" title="Chauffeur assigné">
    <span class="daxi-oc-pipe-dot"><i class="ri-user-star-line"></i></span>
    <span class="daxi-oc-pipe-label">Chauffeur</span>
  </div>
  <div class="daxi-oc-pipe-step {% if idx == 3 %}is-current{% elif idx|add:0 > 3 %}is-done{% endif %}" title="Départ chauffeur">
    <span class="daxi-oc-pipe-dot"><i class="ri-route-line"></i></span>
    <span class="daxi-oc-pipe-label">Départ</span>
  </div>
  <div class="daxi-oc-pipe-step {% if idx == 4 %}is-current{% elif idx|add:0 > 4 %}is-done{% endif %}" title="Service en cours">
    <span class="daxi-oc-pipe-dot"><i class="ri-time-line"></i></span>
    <span class="daxi-oc-pipe-label">En service</span>
  </div>
  <div class="daxi-oc-pipe-step {% if idx == 5 %}is-current{% elif idx|add:0 > 5 %}is-done{% endif %}" title="Forfait terminé">
    <span class="daxi-oc-pipe-dot"><i class="ri-check-double-line"></i></span>
    <span class="daxi-oc-pipe-label">Terminé</span>
  </div>
</div>
{% endwith %}
