{% load static %}

<div style="background:white; border:1px solid #e5e7eb; border-top:4px solid {{ post.color|default:'#667eea' }}; border-radius:12px; padding:20px; margin-top:16px;">
  <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;">
    <div style="font-size:17px; font-weight:800; color:#1f2937; line-height:1.3;">{{ post.title }}</div>
    <button onclick="this.closest('div[id]') && document.getElementById('forum-detail-panel').innerHTML=''"
            hx-on:click="document.getElementById('forum-detail-panel').innerHTML=''"
            style="background:#f3f4f6; border:none; padding:5px 10px; border-radius:6px; cursor:pointer; font-size:14px; color:#6b7280; flex-shrink:0; margin-left:10px;">
      ✕
    </button>
  </div>

  <div style="font-size:11px; color:#9ca3af; margin-bottom:14px;">
    📅 Publié le {{ post.created_at|date:"d/m/Y à H:i" }}
  </div>

  {% if post.content %}
  <div style="font-size:14px; color:#374151; line-height:1.6; white-space:pre-wrap;">{{ post.content }}</div>
  {% endif %}
</div>
