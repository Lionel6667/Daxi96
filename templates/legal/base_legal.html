<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DAXI{% endblock %}</title>
  {% include "partials/daxi_favicon.html" %}
  <style>
    :root { --bg:#0f1419; --card:#1a2332; --border:#2d3a4f; --text:#e7ecf3; --muted:#8b9cb3; --accent:#3b82f6; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background:var(--bg); color:var(--text); line-height:1.65; }
    .wrap { max-width:760px; margin:0 auto; padding:32px 20px 48px; }
    .brand { font-size:14px; color:var(--muted); margin-bottom:8px; }
    .brand a { color:var(--accent); text-decoration:none; }
    h1 { font-size:1.75rem; margin:0 0 8px; }
    h2 { font-size:1.1rem; margin:28px 0 10px; color:#fff; }
    h3 { font-size:1rem; margin:18px 0 8px; color:#dbe4f0; }
    p, li { color:#c9d4e3; }
    ul { padding-left:1.25rem; }
    a { color:#93c5fd; }
    .legal-updated { color:var(--muted); font-size:14px; margin-bottom:24px; }
    .footer { margin-top:40px; padding-top:20px; border-top:1px solid var(--border); font-size:13px; color:var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="brand"><a href="https://daxipro.com/">DAXI</a> · daxipro.com</p>
    <h1>{% block legal_title %}{% endblock %}</h1>
    {% block legal_content %}{% endblock %}
    <div class="footer">
      <a href="{{ privacy_url }}">Politique de confidentialité</a>
      ·
      <a href="{{ deletion_url }}">Suppression des données</a>
      ·
      <a href="mailto:info@daxipro.com">info@daxipro.com</a>
    </div>
  </div>
</body>
</html>
