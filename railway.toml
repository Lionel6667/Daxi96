[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python manage.py migrate --noinput && python manage.py collectstatic --noinput && DJANGO_SETTINGS_MODULE=julmin_taxis.settings daphne -b 0.0.0.0 -p $PORT julmin_taxis.asgi:application"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
